name: money_tracker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  fl_chart: ^1.2.0
  http: ^1.2.1
  drift: 2.34.0
  drift_flutter: ^0.3.1
  uuid: ^4.6.0
  flutter_riverpod: ^3.3.2
  cunning_document_scanner: ^3.0.4
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - images/
  fonts:
    - family: MomoSignature
      fonts:
        - asset: fonts/MomoSignature-Regular.ttf
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-Italic-VariableFont_wght.ttf
          style: italic
        - asset: fonts/Nunito-VariableFont_wght.ttf
          style: normal
    - family: Oswald
      fonts:
        - asset: fonts/Oswald-VariableFont_wght.ttf
